<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>經典踩地雷 Minesweeper</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --panel-bg: #1e293b;
      --border-color: #334155;
      --cell-unrevealed: #3b82f6;
      --cell-unrevealed-hover: #2563eb;
      --cell-revealed: #0f172a;
      --cell-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    .difficulty-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .diff-btn {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .diff-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .diff-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .counter-box {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.45rem;
      font-weight: 700;
      color: #f43f5e;
      background: #020617;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 72px;
      text-align: center;
      letter-spacing: 2px;
      border: 1px solid #1e293b;
    }

    .reset-btn {
      font-size: 1.6rem;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .reset-btn:hover {
      background: #334155;
      transform: scale(1.06);
    }

    .reset-btn:active {
      transform: scale(0.95);
    }

    .mobile-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .mode-toggle {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #334155;
      color: #ffffff;
    }

    .board-wrapper {
      max-width: 100%;
      overflow-x: auto;
      padding: 4px;
      border-radius: 10px;
      background: #0f172a;
      border: 2px solid var(--border-color);
    }

    .board {
      display: grid;
      gap: 2px;
      background: #1e293b;
    }

    .cell {
      width: 32px;
      height: 32px;
      background: linear-gradient(145deg, #3b82f6, #2563eb);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.08s ease;
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.25);
    }

    .cell:hover:not(.revealed) {
      background: linear-gradient(145deg, #60a5fa, #3b82f6);
    }

    .cell:active:not(.revealed) {
      transform: scale(0.94);
    }

    .cell.revealed {
      background: #0f172a;
      box-shadow: none;
      cursor: default;
    }

    .cell.revealed.has-number {
      cursor: pointer;
    }

    .cell.flagged {
      background: linear-gradient(145deg, #475569, #334155);
    }

    .cell.mine-hit {
      background: #ef4444 !important;
      animation: shake 0.35s ease;
    }

    .cell.mine-revealed {
      background: #1e293b;
    }

    .cell.wrong-flag {
      background: #7f1d1d;
    }

    .num-1 { color: #38bdf8; }
    .num-2 { color: #4ade80; }
    .num-3 { color: #f87171; }
    .num-4 { color: #a78bfa; }
    .num-5 { color: #fbbf24; }
    .num-6 { color: #2dd4bf; }
    .num-7 { color: #f472b6; }
    .num-8 { color: #cbd5e1; }

    .result-banner {
      display: none;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .result-banner.win {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    .result-banner.lose {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .tips {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    @media (max-width: 600px) {
      .game-container {
        padding: 14px;
      }
      .cell {
        width: 28px;
        height: 28px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>💣 經典踩地雷</h1>
      <div class="difficulty-bar">
        <button class="diff-btn active" data-level="easy">初級 (9×9)</button>
        <button class="diff-btn" data-level="medium">中級 (16×16)</button>
        <button class="diff-btn" data-level="hard">高級 (16×30)</button>
      </div>
    </header>

    <div class="status-bar">
      <div class="counter-box" id="mine-counter">010</div>
      <button class="reset-btn" id="reset-btn" title="重新開始">🙂</button>
      <div class="counter-box" id="timer">000</div>
    </div>

    <div class="mobile-controls">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-dig">⛏️ 挖掘模式</button>
        <button class="mode-btn" id="mode-flag">🚩 插旗模式</button>
      </div>
    </div>

    <div class="result-banner" id="result-banner"></div>

    <div class="board-wrapper">
      <div class="board" id="board"></div>
    </div>

    <div class="tips">
      💻 電腦：左鍵挖掘 / 右鍵插旗 / 點擊已翻開數字可快速開格<br />
      📱 手機：切換上方「挖掘 / 插旗」模式即可單手操作
    </div>
  </div>

  <script>
    const LEVELS = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard: { rows: 16, cols: 30, mines: 99 }
    };

    let currentLevel = 'easy';
    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let grid = [];
    let gameOver = false;
    let firstClick = true;
    let flagsPlaced = 0;
    let revealedCount = 0;
    let timerInterval = null;
    let seconds = 0;
    let inputMode = 'dig'; // 'dig' or 'flag'

    const boardEl = document.getElementById('board');
    const mineCounterEl = document.getElementById('mine-counter');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');
    const resultBannerEl = document.getElementById('result-banner');
    const modeDigBtn = document.getElementById('mode-dig');
    const modeFlagBtn = document.getElementById('mode-flag');

    function formatCounter(num) {
      if (num < 0) {
        return '-' + String(Math.min(99, Math.abs(num))).padStart(2, '0');
      }
      return String(Math.min(999, num)).padStart(3, '0');
    }

    function initGame() {
      clearInterval(timerInterval);
      timerInterval = null;
      seconds = 0;
      timerEl.textContent = '000';

      const cfg = LEVELS[currentLevel];
      rows = cfg.rows;
      cols = cfg.cols;
      totalMines = cfg.mines;

      gameOver = false;
      firstClick = true;
      flagsPlaced = 0;
      revealedCount = 0;

      mineCounterEl.textContent = formatCounter(totalMines);
      resetBtn.textContent = '🙂';
      resultBannerEl.className = 'result-banner';
      resultBannerEl.textContent = '';

      grid = Array.from({ length: rows }, (_, r) =>
        Array.from({ length: cols }, (_, c) => ({
          r,
          c,
          isMine: false,
          isRevealed: false,
          isFlagged: false,
          neighborMines: 0
        }))
      );

      renderBoard();
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.r = r;
          cellEl.dataset.c = c;

          cellEl.addEventListener('click', () => handleCellClick(r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          cellEl.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !gameOver && !grid[r][c].isRevealed) {
              resetBtn.textContent = '😮';
            }
          });

          boardEl.appendChild(cellEl);
        }
      }
    }

    window.addEventListener('mouseup', () => {
      if (!gameOver) {
        resetBtn.textContent = '🙂';
      }
    });

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatCounter(seconds);
      }, 1000);
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);

        // 首擊保護：點擊位置及其周圍 3x3 區域絕不放置地雷
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        if (grid[r][c].isMine) continue;

        grid[r][c].isMine = true;
        placed++;
      }

      // 計算每個格子周圍地雷數
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].isMine) continue;
          let count = 0;
          getNeighbors(r, c).forEach(([nr, nc]) => {
            if (grid[nr][nc].isMine) count++;
          });
          grid[r][c].neighborMines = count;
        }
      }
    }

    function getNeighbors(r, c) {
      const neighbors = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            neighbors.push([nr, nc]);
          }
        }
      }
      return neighbors;
    }

    function getCellEl(r, c) {
      return boardEl.children[r * cols + c];
    }

    function handleCellClick(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];

      // 若已翻開且有數字，執行快速開格 (Chord)
      if (cell.isRevealed && cell.neighborMines > 0) {
        chordReveal(r, c);
        return;
      }

      if (inputMode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      if (cell.isFlagged || cell.isRevealed) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        startTimer();
      }

      revealCell(r, c);
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.isRevealed) return;

      if (firstClick) {
        startTimer();
      }

      cell.isFlagged = !cell.isFlagged;
      flagsPlaced += cell.isFlagged ? 1 : -1;
      mineCounterEl.textContent = formatCounter(totalMines - flagsPlaced);

      const cellEl = getCellEl(r, c);
      if (cell.isFlagged) {
        cellEl.classList.add('flagged');
        cellEl.textContent = '🚩';
      } else {
        cellEl.classList.remove('flagged');
        cellEl.textContent = '';
      }
    }

    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      const cellEl = getCellEl(r, c);
      cellEl.classList.add('revealed');

      if (cell.isMine) {
        cellEl.classList.add('mine-hit');
        cellEl.textContent = '💥';
        endGame(false);
        return;
      }

      revealedCount++;

      if (cell.neighborMines > 0) {
        cellEl.textContent = cell.neighborMines;
        cellEl.classList.add(`num-${cell.neighborMines}`, 'has-number');
      } else {
        // 空白格自動遞迴展開四周
        getNeighbors(r, c).forEach(([nr, nc]) => {
          if (!grid[nr][nc].isRevealed && !grid[nr][nc].isFlagged) {
            revealCell(nr, nc);
          }
        });
      }

      checkWin();
    }

    function chordReveal(r, c) {
      const cell = grid[r][c];
      const neighbors = getNeighbors(r, c);
      const flaggedNeighbors = neighbors.filter(([nr, nc]) => grid[nr][nc].isFlagged);

      if (flaggedNeighbors.length === cell.neighborMines) {
        neighbors.forEach(([nr, nc]) => {
          if (!grid[nr][nc].isRevealed && !grid[nr][nc].isFlagged) {
            revealCell(nr, nc);
          }
        });
      }
    }

    function checkWin() {
      if (gameOver) return;
      const totalSafeCells = rows * cols - totalMines;
      if (revealedCount === totalSafeCells) {
        endGame(true);
      }
    }

    function endGame(isWin) {
      gameOver = true;
      clearInterval(timerInterval);

      if (isWin) {
        resetBtn.textContent = '😎';
        mineCounterEl.textContent = '000';
        // 自動將剩餘地雷插上旗子
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r][c].isMine && !grid[r][c].isFlagged) {
              const el = getCellEl(r, c);
              el.classList.add('flagged');
              el.textContent = '🚩';
            }
          }
        }
        resultBannerEl.className = 'result-banner win';
        resultBannerEl.textContent = `🎉 恭喜過關！總耗時 ${seconds} 秒`;
      } else {
        resetBtn.textContent = '😵';
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = grid[r][c];
            const el = getCellEl(r, c);
            if (cell.isMine && !cell.isRevealed && !cell.isFlagged) {
              el.classList.add('revealed', 'mine-revealed');
              el.textContent = '💣';
            } else if (!cell.isMine && cell.isFlagged) {
              el.classList.add('wrong-flag');
              el.textContent = '❌';
            }
          }
        }
        resultBannerEl.className = 'result-banner lose';
        resultBannerEl.textContent = `💥 踩到地雷了！堅持了 ${seconds} 秒，點擊表情重新挑戰`;
      }
    }

    // 難度切換
    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentLevel = btn.dataset.level;
        initGame();
      });
    });

    // 重置按鈕
    resetBtn.addEventListener('click', initGame);

    // 行動裝置模式切換
    modeDigBtn.addEventListener('click', () => {
      inputMode = 'dig';
      modeDigBtn.classList.add('active');
      modeFlagBtn.classList.remove('active');
    });

    modeFlagBtn.addEventListener('click', () => {
      inputMode = 'flag';
      modeFlagBtn.classList.add('active');
      modeDigBtn.classList.remove('active');
    });

    // 啟動遊戲
    initGame();
  </script>
</body>
</html>
